<svg viewBox="0 0 800 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing how test-data, pages, fixture, utility and tests files connect, from test data down to the live KlipBoard site">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="680" fill="#ffffff"/>

  <!-- Lane 1: test-data -->
  <rect x="100" y="40" width="480" height="100" rx="10" fill="#fef6d8" stroke="#d4b106" stroke-width="1.5"/>
  <text x="340" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">test-data/</text>
  <text x="340" y="88" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">home.json — url, title, heading</text>
  <text x="340" y="110" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">api-endpoints.json — path, expectedStatus, ...</text>

  <!-- Lane 2: pages + fixture -->
  <rect x="100" y="190" width="480" height="110" rx="10" fill="#e6f4ff" stroke="#1677ff" stroke-width="1.5"/>
  <text x="340" y="213" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">pages/  +  fixture/</text>
  <text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">base-page.ts  →  klipboard-homepage.ts</text>
  <text x="340" y="260" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">test-options.ts — exports test, expect,</text>
  <text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">+ a ready-made homepage fixture</text>

  <!-- Lane 3: tests -->
  <rect x="100" y="350" width="480" height="130" rx="10" fill="#f0f9e8" stroke="#52c41a" stroke-width="1.5"/>
  <text x="340" y="373" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">tests/</text>
  <text x="340" y="398" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">home.spec.ts</text>
  <text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">accessibility.spec.ts</text>
  <text x="340" y="442" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">api.spec.ts  (two request paths — see diagram 2)</text>

  <!-- Lane 4: live site -->
  <rect x="100" y="560" width="480" height="70" rx="10" fill="#fff0f0" stroke="#f5222d" stroke-width="1.5"/>
  <text x="340" y="600" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">🌐 Live KlipBoard site — klipboard.com</text>

  <!-- Main pipeline arrows -->
  <line x1="340" y1="140" x2="340" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="168" font-family="sans-serif" font-size="11.5" fill="#555">JSON rows</text>

  <line x1="340" y1="300" x2="340" y2="348" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="328" font-family="sans-serif" font-size="11.5" fill="#555">test, expect, + page object</text>

  <line x1="340" y1="480" x2="340" y2="558" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="523" font-family="sans-serif" font-size="11.5" fill="#555">runs against</text>

  <!-- Side box: utility/accessibility.ts -->
  <rect x="610" y="455" width="170" height="55" rx="8" fill="#e6fffb" stroke="#13a8a8" stroke-width="1.5"/>
  <text x="695" y="475" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#333">utility/</text>
  <text x="695" y="491" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#333">accessibility.ts</text>
  <line x1="610" y1="470" x2="582" y2="425" stroke="#13a8a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Side box: tsconfig.json -->
  <rect x="610" y="40" width="170" height="60" rx="8" fill="#eef0ff" stroke="#6b7fd7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="695" y="62" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#333">tsconfig.json</text>
  <text x="695" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">enables .json imports</text>
  <line x1="610" y1="80" x2="582" y2="92" stroke="#6b7fd7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>

  <!-- Side box: playwright.config.ts -->
  <rect x="610" y="355" width="170" height="70" rx="8" fill="#eef0ff" stroke="#6b7fd7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="695" y="377" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#333">playwright.config.ts</text>
  <text x="695" y="395" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">baseURL · browsers</text>
  <text x="695" y="410" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">· reporters</text>
  <line x1="610" y1="385" x2="582" y2="390" stroke="#6b7fd7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDashed)"/>
</svg>
